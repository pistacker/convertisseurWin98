<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convertisseur de nombres entre binaire, décimal, hexadécimal et octal." />
    <title>Convertisseur de bases numériques</title>
    <link rel="stylesheet" href="style.css" />
    <script src="/scripts/converter.js" defer></script>
</head>

<body>
    <div class="title-bar">
        <div class="title-bar-text">Convertisseur de bases numeriques</div>
        <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize" disabled></button>
            <button aria-label="Close"></button>
        </div>
    </div>

    <div class="window-body">
        <header>
            <p>
                Convertissez un nombre entre les systèmes binaire, décimal, hexadécimal et octal.
            </p>
        </header>

        <main>
            <section aria-labelledby="converter-title">
                <h2 id="converter-title">Convertir un nombre</h2>

                <form id="converter-form">
                    <div>
                        <label for="number-input">Nombre à convertir</label>
                        <input type="text" id="number-input" name="number" placeholder="Ex. : 1010" autocomplete="off" required />
                    </div>

                    <div class="field-row">
                        <fieldset>
                            <legend>Base de départ</legend>
                            <input id="radio5" type="radio" name="source" value="2" checked />
                            <label for="radio5">Binaire (base 2)</label>
                            <input id="radio6" type="radio" name="source" value="10" />
                            <label for="radio6">Décimal (base 10)</label>
                            <input id="radio7" type="radio" name="source" value="16" />
                            <label for="radio7">Hexadécimal (base 16)</label>
                            <input id="radio8" type="radio" name="source" value="8" />
                            <label for="radio8">Octal (base 8)</label>
                        </fieldset>
                    </div>

                    <div class="field-row">
                        <fieldset>
                            <legend>Base de résultat</legend>
                            <input id="target2" type="radio" name="target" value="2" checked />
                            <label for="target2">Binaire (base 2)</label>
                            <input id="target10" type="radio" name="target" value="10" />
                            <label for="target10">Décimal (base 10)</label>
                            <input id="target16" type="radio" name="target" value="16" />
                            <label for="target16">Hexadécimal (base 16)</label>
                            <input id="target8" type="radio" name="target" value="8" />
                            <label for="target8">Octal (base 8)</label>
                        </fieldset>
                    </div>

                    <div>
                        <button type="submit">Convertir</button>
                        <button type="reset">Effacer</button>
                    </div>
                </form>

                <section aria-labelledby="result-title" aria-live="polite">
                    <h2 id="result-title">Résultat</h2>
                    <output id="conversion-result" for="number-input">Le résultat s’affichera ici.</output
              >
              <p id="conversion-error" role="alert"></p>
            </section>
          </section>
        </main>

        <footer>
          <p>Convertisseur de bases numériques</p>
        </footer>
      </div>
    </div>
  </body>
</html>
